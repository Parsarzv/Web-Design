  <main>
    <section class="container">
      <h1>تماس با ما</h1>
      <p>
        اگر سوال، پیشنهاد یا انتقادی دارید خوشحال می‌شویم با ما در میان بگذارید.
      </p>

      <form class="validation">
        <div class="md-textfield">
          <label for="fullname">نام و نام خانوادگی:</label>
          <input type="text" id="fullname" name="fullname" placeholder="مثلاً سید پارسا رضویان" required>
          <small class="error"></small>
        </div>
        <div class="md-textfield">
          <label for="email">ایمیل:</label>
          <input type="email" id="email" name="email" placeholder="ایمیل خود را وارد کنید" required>
          <small class="error"></small>
        </div>
        <div class="md-textfield">
          <label>پیام شما</label>
          <textarea rows="5" placeholder="متن پیام..." required></textarea>
        </div>

        <button class="md-btn filled" type="submit">ارسال پیام</button>
      </form>

      <footer>© 2025 Shocoland — همه حقوق محفوظ است.</footer>
    </section>

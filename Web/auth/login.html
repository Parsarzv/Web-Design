    <meta charset="UTF-8">

</head>

<body>
    <header>
        <nav class="navbar">
            <div class="brand"><img src="../assets/Images/photo_2025-11-16_18-24-06-removebg-preview (1).png"
                    alt="Chocolate Logo"></div>
            <ul class="nav-links">

    <main>
        <section class="container">
            <h1>ورود به حساب کاربری</h1>
            <form>
                <div class="md-textfield">
                    <label for="email">ایمیل:</label>
                    <input type="email" id="email" name="email" placeholder="ایمیل خود را وارد کنید" required>
                </div>

                <div class="md-textfield">
                    <label for="password">رمز عبور:</label>
                    <input type="password" id="password" name="password" placeholder="رمز عبور را وارد کنید" required>
                </div>
                <button class="md-btn filled" type="submit">ورود</button>

                <p><a href="forgot.html">فراموشی رمز عبور؟</a></p>
                <p>حساب کاربری ندارید؟ <a href="signup.html">ثبت‌نام</a></p>
            </form>
        </section>
    </main>
</body>
